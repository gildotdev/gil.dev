<!doctype html>

    <meta charset="UTF-8" />

    <style>
      @font-face { font-family: "Departure Mono"; src: url("assets/fonts/DepartureMono-Regular.woff2") format("woff2"); }
      @font-face { font-family: "Dank Mono"; src: url("assets/fonts/DankMono-Regular.otf") format("opentype"); }
      :root {
        --ground: #faf4ed; --surface: #fffaf3; --ink: #464261; --muted: #797593;
        --love: #b4637a; --gold: #ea9d34; --pine: #286983; --foam: #56949f; --iris: #907aa9;
        --line: rgba(70, 66, 97, .16); --audio-glow: .09;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      body { color: var(--ink); font-family: "Dank Mono", monospace; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; isolation: isolate; }
      #root::before, #root::after { content: ""; position: absolute; z-index: 0; border-radius: 50%; filter: blur(12px); opacity: var(--audio-glow); }
      #root::before { width: 720px; height: 720px; left: -170px; top: -230px; background: var(--gold); }
      #root::after { width: 840px; height: 840px; right: -260px; bottom: -360px; background: var(--iris); }
      .scene { position: absolute; z-index: 1; inset: 0; width: 1920px; height: 1080px; border: 0; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-at0g" id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1920" data-height="1080">

    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      const frames = window.__GARDEN_AUDIO__?.frames ?? [];
      addEventListener("hf-seek", (event) => {
        const frame = frames[Math.min(frames.length - 1, Math.max(0, Math.round(event.detail.time * 30)))];
        const rms = frame?.rms ?? 0;
        document.documentElement.style.setProperty("--audio-glow", String(0.085 + rms * 0.055));
      });
      tl.seek(0);
    </script>
